<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Cupertino — menu bar template</title>
  <!-- The mark reduced to two shapes: a disc setting behind a horizon. Pure
       black plus alpha — AppKit tints a template image itself. Design canvas
       variant F3, "setting sun", resized and reseated to sit beside Bastion's
       glyph, and with the icon's own hill under it; see below.

       Coordinates are the canvas's own 36-unit grid at 18pt, so 2 units = 1pt.

       THE HILL IS THE ICON'S. It was a symmetric dome, which the icon's ridge
       never was: `cupertino-mark.svg` draws an S-wave, crest left and trough
       right, and this is that curve at the same proportions —

         crest    25.5% across the span   (10.90, 27.01)
         crossing 51.0%                   (18.30, 28.61)
         trough   76%                     (25.55, 30.21)

       Only the amplitude is dialled down: 1.6 units against the 2.6 a
       proportional transcription of the icon would give. 2.6 holds together and
       was rendered — but its trough reaches y32.0, and at 18pt the sun starts
       reading as sliding off to the right rather than setting behind a ridge.
       Keep the proportions above on any change and move the amplitude alone.

       THE CUT IS A CLIPPATH, NOT THE MASK the canvas draws it with.
       Transcribed literally, the canvas's mask (a 6-wide black stroke along the
       horizon) renders with about 25% residual alpha all along the cut, and
       that residue bridges the disc to the horizon: the glyph comes out as one
       connected shape instead of two. A clipPath cuts hard. Do not "simplify"
       this back to a mask.

       THE CLIP IS A TRUE NORMAL OFFSET, and it has to be. It used to be the
       horizon shifted straight UP by 3 units, which is only correct while the
       curve is shallow — and this hill is not. The wave puts a 0.43 slope
       directly under the sun, where a vertical offset would measure only 2.75
       units of sky perpendicular instead of 3.00; at the icon's own 2.6
       amplitude it would be 2.45, thinning the sky by a quarter in the one
       place that cannot afford it.

       So the clip is the horizon pushed 3 units along its own perpendicular,
       fitted as two cubics. Max deviation from the exact offset is 0.025 units
       = 0.013pt — tighter than the 0.03pt the old vertical shortcut carried
       even on the shallow dome. A normal offset can cusp if it exceeds the
       curve's radius of curvature; the minimum here is 15.55 units against a
       3-unit offset, so it cannot. It is also extended flat past both ends,
       because the horizon does not span the canvas but the cut must be
       continuous everywhere the disc and its halo reach.

       SKY. Because the offset is perpendicular, the sky between the disc's cut
       and the top of the horizon's stroke is exactly 3 − 0.9 = 2.1 units =
       1.05pt at EVERY point along the curve, at any amplitude. That gap is the
       whole glyph — lose it and the sun welds to the horizon and the mark reads
       as a blob. It is now structural rather than tuned: resize the hill or the
       sun freely, and leave the 3 and the 1.8 alone.

       THE FAMILY. These are two apps by one author and their menu bar glyphs
       sit in the same bar, so they are measured against each other rather than
       admired separately. This glyph was once a third lighter than Bastion's
       fort and much wider — 34.0 x 16.8 units at 16.8% ink, against 23.0 x 18.2
       at 22.4% — because its width was all horizon: a thin rule running nearly
       edge to edge past a small sun. It is now matched on ink, which is the
       number that decides which of two glyphs looks heavier in a bar:

                        ink              ink %   ink mass cy
         this, idle     15.50 x 9.90pt   22.4    21.11
         Bastion, idle  11.50 x 9.10pt   22.4    21.09
         this, active   15.50 x 11.90pt  28.6    19.75
         Bastion, act.  15.75 x 12.40pt  29.7    19.77

       SITTING IT DOWN. The glyph is placed so its ink MASS — not its bounding
       box — lands where Bastion's does. Centring by box is wrong here for the
       reason it was always wrong here: the disc is a solid mass and the horizon
       is a 0.9pt line, so the eye follows the disc. The sun's sink is
       proportional to its radius (it sits 0.378r above the cut), so growing the
       sun cannot quietly turn a setting one into a rising one; keep that ratio.

       Worth knowing before anybody moves it: measured off a real menu bar
       screenshot, macOS's own status items put their ink mass around y32.3 in
       screen pixels and this pair sits near y35 — aligned with each other, but
       about 1.5pt below the platform's line. The fix, if it is ever taken, is
       to raise BOTH apps by the same amount rather than to move one.

       Re-measure with a connected-component count on a real render after any
       edit, never by eye: at 1x the failure is the disc touching the horizon,
       and it is invisible at the size you will be looking at it. -->
  <defs>
    <clipPath id="sky">
      <path d="M-4 -4 L40 -4 L40 25.9 L31.22 25.9 C27.47 27.66 23.73 27.69 19.49 25.86
               C13.81 23.4 7.99 23.4 2.31 25.86 L-4 25.86 Z" />
    </clipPath>
  </defs>
  <circle cx="18" cy="21.86" r="10.2" fill="#000" clip-path="url(#sky)" />
  <path d="M3.5 28.61 Q10.9 25.41 18.3 28.61 T32.5 28.61" fill="none" stroke="#000"
    stroke-width="1.8" stroke-linecap="round" />
</svg>
