      <path d="M-60 -60 H1260 V700 Q1112 632 984 700 Q856 768 728 700 Q600 632 472 700 Q344 768 216 700 Q88 632 -40 700 Z"></path>
    </clipPath>
  </defs>


  <g fill="#FFF6E8" fill-opacity=".92" clip-path="url(#sky)">
    <!-- Mainsail, then jib. -->
    <path d="M519 176 C639 356 701 576 719 800 L519 800 Z"></path>
    <path d="M483 296 C391 440 325 616 305 800 L483 800 Z"></path>
  </g>


  <path d="M-40 700 Q88 632 216 700 T472 700 T728 700 T984 700 T1240 700 V1064 H-40 Z" fill="#B0532F" opacity=".9"></path>

