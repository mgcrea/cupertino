<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Cupertino — menu bar template, a client is connected</title>
  <!-- The idle mark plus one shape: a thin halo around the sun. Everything else
       is byte-identical to cupertino-menubar.svg, deliberately — the two are
       swapped in place in the menu bar, so any drift in the waves would read as
       the icon twitching rather than as a state changing.

       The halo geometry is measured, not chosen. The sun is r5.8 at cy9.5, so
       there are only 3.7 units of headroom before the canvas edge, and a ring
       needs a readable gap plus its own stroke inside that. At r8.0/sw1.1 the
       inner edge sits 1.65 units clear of the sun and the outer edge stops 0.95
       units short of the top: the widest ring that still separates.

       What that buys, per rendering both and diffing them: at 2x the halo is a
       distinct third shape with a real gap. At 1x it is not — the gap falls
       below a pixel and the sun reads as fatter rather than ringed. That is
       acceptable degradation and not a bug to chase: going wider clips the top
       edge, going thinner stops reading at all. Retina is the design target and
       1x still changes visibly, which is what the state needs to do.

       Re-measure with a component count after any edit, never by eye. -->
  <g fill="none" stroke="#000" stroke-linecap="round">
    <circle cx="18" cy="9.5" r="5.8" fill="#000" stroke="none"/>
    <circle cx="18" cy="9.5" r="8.0" stroke-width="1.1"/>
    <path d="M3 23 C7.5 18 12.5 18 17 22 C21.5 26 27 25 33 19.5" stroke-width="2.2"/>
    <path d="M2 32 L2 28 C7 23 13 23 18 27.5 C23 32 28.5 30.5 34 25.5 L34 32 Z" fill="#000" stroke="none"/>
  </g>
</svg>
