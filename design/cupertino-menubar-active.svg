<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="18" height="18">
  <title>Cupertino — menu bar template, a client is connected</title>
  <!-- The idle mark plus one shape: a halo around the sun, setting behind the
       same hill. Everything else is identical to cupertino-menubar.svg,
       deliberately — the two are swapped in place in the menu bar, so any drift
       in the disc, the hill or the clip would read as the icon twitching rather
       than as a state changing. Read that file before changing anything here:
       the hill's proportions come from the app icon, the clip is a true normal
       offset for a reason, and the seat is measured against Bastion's glyph.
       The halo is inside the same clip as the disc, so both terminate on one
       line and the ring sets with the sun.

       The gap is measured, not chosen. Sweeping it at 18pt/2x and counting
       connected components: at 2.0 units the disc's antialiased edge still
       meets the ring's diagonally and the two fuse into one shape; at 2.2 they
       separate. This sits at 2.4 — one step clear of that boundary rather than
       balanced on it — with a 1.6-unit stroke.

       THE RADIUS IS DERIVED FROM THAT, not picked: 10.2 + 2.4 + 0.8 = 13.4.
       The sun has grown while this glyph was matched to Bastion's mass, and the
       ring simply followed it out. Re-derive it the same way if the sun changes
       again rather than nudging it — the gap and the stroke are what is kept.

       That the ring can be this generous is the point of F3. E2c put its sun at
       cy9.5 with 3.7 units of headroom, which forced a 1.1-unit stroke across a
       1.65-unit gap — and measured, that ring never actually separated from its
       sun at 2x, whatever its file claimed. This leaves 11.7 units above the
       disc.

       The ring is what makes this state ride higher than the idle one: it adds
       4.0 units above the disc and nothing below, since its lower half is
       clipped away by the hill. That is inherent to a sun setting behind
       something — there is no symmetric halo to be had — and it is why the two
       states are seated by ink mass rather than by bounding box. Bastion's wall
       is one-sided in the same direction and by nearly the same amount, which
       is what lets one seat serve both apps.

       At 1x the gap does not resolve; the sun reads as ringed-and-fatter rather
       than as two shapes, and a component count says the glyph is one. Bastion's
       wall does exactly the same thing at that size. That is acceptable
       degradation, not a bug to chase — retina is the design target, and 1x
       still changes visibly, which is what the state needs to do.

       Re-measure with a component count after any edit, never by eye. -->
  <defs>
    <clipPath id="sky">
      <path d="M-4 -4 L40 -4 L40 25.9 L31.22 25.9 C27.47 27.66 23.73 27.69 19.49 25.86
               C13.81 23.4 7.99 23.4 2.31 25.86 L-4 25.86 Z" />
    </clipPath>
  </defs>
  <g clip-path="url(#sky)">
    <circle cx="18" cy="21.86" r="10.2" fill="#000" />
    <circle cx="18" cy="21.86" r="13.4" fill="none" stroke="#000" stroke-width="1.6" />
  </g>
  <path d="M3.5 28.61 Q10.9 25.41 18.3 28.61 T32.5 28.61" fill="none" stroke="#000"
    stroke-width="1.8" stroke-linecap="round" />
</svg>
