name: CI

on:
  push:
    branches: [main]
    # Tags name the package they release: mail-v0.1.0, notes-v0.1.0.
    tags: ["*-v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the fast gate. macos matters because this package is
        # darwin-only in practice: the osascript layer, the .emlx paths and
        # node:sqlite's URI handling only really exist there, and a suite that
        # never runs on macOS would let a darwin-only break reach a release.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          # The website imports apps/website/src/assets/shots/*.png through
          # astro:assets, and those are LFS-tracked. A checkout without this
          # gets 131-byte pointer files that are still named .png, so the
          # `Build` step below fails inside sharp with an error about the image
          # format rather than about the checkout.
          lfs: true
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      # Build BEFORE typecheck and test, not after. packages/core resolves to
      # `./dist/index.d.ts`, and dist is gitignored — so on a clean checkout
      # every package importing @mgcrea/mcp-apple-core fails with TS2307 until
      # core has been built. This passes locally either way, because a developer
      # already has a dist/ lying around from the last build; only a cold clone
      # shows it. `pnpm -r build` orders the workspace topologically, so core
      # comes first without naming it here.
      - name: Build 📦
        run: pnpm run build
      - name: TypeScript 🔍
        run: pnpm run typecheck
      # The surface list lives in surfaces.json and is generated into nine other
      # files, including BOTH copies of the Apple Events consent string. This is
      # what makes the manifest the source of truth rather than a suggestion: a
      # hand-edit to any generated region fails here instead of shipping a
      # Release whose consent prompt names the wrong apps.
      - name: Surface manifest 🔍
        run: make surfaces-check
      # Confirms the committed revocation list still matches D1. It does not
      # regenerate: the file in git is what the build uses, and fetching it here
      # would make a Cloudflare outage an outage in releases. With no token —
      # a fork, a pull request, a clean clone — the script skips and exits 0.
      - name: Revocation list 🔍
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/generate-revocations.mjs --check
      # The suite is entirely offline: osascript is faked, the Envelope Index is
      # a fixture built with node:sqlite, and .emlx files are written to a temp
      # dir. APPLE_MAIL_INTEGRATION is deliberately never set here — a runner
      # has no configured Mail and no TCC grants, so an integration test would
      # either fail or, worse, pass for the wrong reason.
      - name: Test 🧪
        run: pnpm run test
      # The launcher is what gives the server its own Full Disk Access identity,
      # so a compile break in it would only surface at install time otherwise.
      - name: Launcher compiles 🔨
        if: runner.os == 'macOS'
        run: |
          clang -O2 -Wall -Wextra -Werror \
            -DNODE_PATH='"/usr/bin/false"' \
            -DSERVER_PATH='"/dev/null"' \
            -o /tmp/launcher-check packages/mail/native/launcher.c
      # ClientWiring merges into config files this app does not own, so the
      # properties it promises out loud — unrelated keys survive, the previous
      # contents are recoverable, a crash mid-write cannot truncate — are worth
      # a gate. Standalone swiftc for the same reason the launcher above is:
      # the Xcode project has no test target and adding one costs more than
      # the code under test.
      - name: Wiring merge 🔧
        if: runner.os == 'macOS'
        run: make wiring-check
      # docs/licensing.md sells the app partly on it being unable to reach the
      # network, so that claim is a gate rather than a sentence in a README.
      # Unsigned is fine: the audit reads symbols, and signing does not add any.
      - name: No network 🔌
        if: runner.os == 'macOS'
        run: |
          make app XCARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"
          scripts/audit-network.sh
      # Proves the built server actually speaks MCP over stdio, which a unit
      # test using an in-memory transport cannot.
      #
      # macOS only, and not merely as an optimisation: packages/core/src/cli.ts
      # refuses to start on any other platform and exits 1 before the transport
      # is connected, because these servers drive macOS apps. Run on ubuntu this
      # step can never pass — and it failed silently for a while, because
      # `2>/dev/null` hides the very message that says why.
      - name: MCP handshake 🤝
        if: runner.os == 'macOS'
        run: |
          # <generated:surfaces> generated from surfaces.json by `make surfaces` — do not edit by hand
          for server in mail notes reminders calendar contacts messages safari; do
          # </generated:surfaces>
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              | node "packages/$server/dist/cli.js" 2>/dev/null | tee "/tmp/handshake-$server.json"
            grep -q '"serverInfo"' "/tmp/handshake-$server.json"
          done

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    # `contains(github.ref, '-v')` also matched branches, and matched `app-v*`,
    # whose slug resolves to a packages/app that does not exist — so the app tag
    # would have hard-failed here and never reached a release at all. The app has
    # its own lane below.
    #
    # `api-v*` is excluded for the same reason and a worse consequence: the tag
    # glob is `*-v*.*.*`, so apps/api — which is private and must never reach npm
    # — would otherwise be routed straight into this job by its own release tag.
    if: startsWith(github.ref, 'refs/tags/')
      && !startsWith(github.ref, 'refs/tags/app-v')
      && !startsWith(github.ref, 'refs/tags/api-v')
    # id-token: write is required for OIDC trusted publishing + provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm 🔧
        # OIDC trusted publishing needs a recent npm CLI. pnpm shells out to it
        # for the token exchange, so this matters even though npm never publishes.
        run: npm install -g npm@latest
      # A version already on npm cannot be republished, so re-running this job —
      # after re-pushing a tag, or a manual re-run — would fail on a duplicate.
      # Skip instead, so the tag stays the source of truth.
      # The tag prefix picks the package, so one workflow releases any of them
      # and a tag can never publish a package it does not name.
      - name: Resolve package from tag 🔍
        id: pkg
        run: |
          slug="${GITHUB_REF_NAME%%-v*}"
          dir="packages/$slug"
          if [ ! -f "$dir/package.json" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} names '$slug', but $dir/package.json does not exist"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./$dir/package.json').name")" >> "$GITHUB_OUTPUT"
      # `prepublishOnly` builds only the tagged package, and its dts generation
      # reads core's `.d.ts` — which is gitignored and would not exist on a cold
      # checkout. The `...` suffix selects the package AND its workspace
      # dependencies, in topological order, so core is built first.
      #
      # NOT `pnpm -r build`, which was the first attempt and broke this job: it
      # builds apps/website too, whose images are LFS-tracked. Only the `test`
      # job checks out with `lfs: true`, so here astro got 131-byte pointer
      # files and died in NoImageMetadata — a marketing-site failure stopping an
      # npm publish that has nothing to do with it.
      - name: Build 🏗️
        run: pnpm --filter "${{ steps.pkg.outputs.name }}..." build
      - name: Check npm for this version 🔍
        id: published
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # `pnpm publish`, never `npm publish`. Every surface package depends on core
      # as `workspace:^`, and npm does not understand that protocol — it would ship
      # the literal string in the tarball and every `npm i` would fail with
      # `Unsupported URL Type "workspace:"`. pnpm substitutes the real version at
      # pack time. The idempotency check above would have called that a success.
      # `--no-git-checks` because the job runs on a detached tag, not a branch.
      - name: Publish 🚀
        if: steps.published.outputs.exists == 'false'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm publish --provenance --access public --no-git-checks

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/')
      && !startsWith(github.ref, 'refs/tags/app-v')
      && !startsWith(github.ref, 'refs/tags/api-v')
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # NOT the latest release, and this is load-bearing rather than tidy.
          # GitHub awards "Latest" to whichever release is newest by date, and
          # apps/website/src/config.ts points the download button and the
          # checksum link at /releases/latest/download/Cupertino.zip. A
          # `core-v*` release carries no such asset, so without this the first
          # npm tag silently 404s the website's download button until the next
          # app release takes the badge back.
          #
          # `make_latest: false`, not `prerelease: true`: these are real
          # releases, and marking them pre-release to dodge the badge would be
          # a lie told to a UI.
          make_latest: false

  # The app ships as a Developer ID signed, notarized zip attached to a GitHub
  # release — never from the website, whose Cloudflare assets binding caps a
  # single file at 25 MiB against a bundle that embeds a universal Node runtime.
  # See docs/distribution.md.
  deploy-api:
    name: Deploy the licence API
    runs-on: ubuntu-latest
    needs: test
    # Its own tag namespace, like the app's. Both are excluded from publish-npm
    # above, because the tag glob `*-v*.*.*` would otherwise route them there.
    if: startsWith(github.ref, 'refs/tags/api-v')
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      # Before the deploy, not after: a Worker that is live against a database
      # missing a column it reads fails on a real payment. Migrations here are
      # additive by construction — see apps/api/migrations.
      - name: Migrate D1 🗄️
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mgcrea/cupertino-api exec wrangler d1 migrations apply cupertino-licenses --remote
      - name: Deploy 🚀
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @mgcrea/cupertino-api exec wrangler deploy

  release-app:
    name: Release Cupertino.app
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/app-v')
    permissions:
      contents: write
      # attest-build-provenance signs the artifact's provenance, which is half of
      # the "reproducible builds and published checksums" claim in docs/licensing.md.
      id-token: write
      attestations: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Resolve version from tag 🔍
        id: version
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::tag ${GITHUB_REF_NAME} does not carry a semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # macOS 26 is the deployment target, so a runner image without that SDK
      # fails deep inside xcodebuild with nothing pointing at the cause.
      - name: Check the SDK 🔍
        run: |
          xcodebuild -showsdks | grep -E 'macosx2[6-9]' \
            || { echo "::error::no macOS 26+ SDK on this runner image"; exit 1; }
      - name: Import signing certificate 🔑
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on an interactive keychain prompt that
          # a runner can never answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # `make sign` falls back to an Apple Development certificate with only a
          # warning. That is right on a developer's Mac and wrong here: it would
          # produce a build that cannot notarize, several minutes later and for a
          # reason the notarytool output does not name.
          security find-identity -v -p codesigning | grep -q 'Developer ID Application' \
            || { echo "::error::no Developer ID Application identity after import"; exit 1; }
      - name: Build, sign and notarize 📦
        env:
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
        run: |
          printf '%s' "${{ secrets.AC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/ac.p8"
          export AC_KEY_PATH="$RUNNER_TEMP/ac.p8"
          # CFBundleVersion is the commit count, not github.run_number, so that a
          # tag always produces the same number. docs/licensing.md sells
          # reproducible builds and published checksums; a build number that
          # changes on every re-run makes the same source produce a different
          # binary and a different SHA-256, which is the one thing that claim
          # cannot survive. Needs the fetch-depth: 0 checkout above — a shallow
          # clone would silently count only what it fetched.
          build=$(git rev-list --count HEAD)
          test "$build" -gt 0 2>/dev/null \
            || { echo "::error::could not count commits; is this a shallow clone?"; exit 1; }
          echo "CFBundleVersion=$build (from $(git rev-parse --short HEAD))"
          make build-release \
            XCARGS="MARKETING_VERSION=${{ steps.version.outputs.version }} CURRENT_PROJECT_VERSION=$build"
      # Every claim the download page makes, checked against the artifact that is
      # about to be uploaded rather than against the tree it was built from.
      - name: Verify the artifact 🔍
        run: |
          app="apps/apple/.build/Build/Products/Release/Cupertino.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vvv -t install "$app"
          scripts/audit-network.sh "$app"
      - name: Checksum 🔢
        working-directory: apps/apple/.build
        run: shasum -a 256 Cupertino.zip | tee Cupertino.zip.sha256
      # After Checksum, and that ordering is load-bearing: `make notarize`
      # re-creates Cupertino.zip once the ticket is stapled, so a signature made
      # any earlier would be valid over an artifact with no ticket — Sparkle
      # would accept the download and Gatekeeper would refuse it on first
      # launch. Signed here, the published .sha256 and the edSignature describe
      # the same bytes.
      - name: Sign the update 🔏
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: make appcast
      - name: Attest provenance 🔏
        uses: actions/attest-build-provenance@v3
        with:
          # The feed too: it names the bytes Sparkle will install, so it is part
          # of what a user ends up trusting.
          subject-path: |
            apps/apple/.build/Cupertino.zip
            apps/apple/.build/appcast.xml
      # The asset name carries no version on purpose: it is what makes
      # /releases/latest/download/Cupertino.zip a permanent URL, which the website
      # redirect and the Homebrew cask both point at. The version lives in the tag.
      - name: Release 🚀
        uses: softprops/action-gh-release@v2
        with:
          name: Cupertino ${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Explicit, though it is also the default: the app owns the "Latest"
          # slot because /releases/latest/download/Cupertino.zip is what the
          # website and the docs hand people. The package lane opts out above.
          make_latest: true
          files: |
            apps/apple/.build/Cupertino.zip
            apps/apple/.build/Cupertino.zip.sha256
            apps/apple/.build/appcast.xml
      # After the release exists, never before: the cask names a URL that 404s
      # until the assets are attached, and a tap that points at a missing
      # download is worse than a tap that is one version behind.
      #
      # Skipped rather than failed when the token is absent, so the app release
      # itself does not hang on a secret that only affects a second repository.
      #
      # The guard is in the shell, NOT in `if:`. The `secrets` context is not
      # available to a step-level condition, and referencing it there is not a
      # skipped step — it fails the whole workflow at startup, before a single
      # job is created, which is how it took the app release down with it.
      - name: Bump the Homebrew cask 🍺
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set — skipping the cask bump."
            exit 0
          fi
          sha=$(cut -d' ' -f1 apps/apple/.build/Cupertino.zip.sha256)
          sed -e "s|@@VERSION@@|$VERSION|" -e "s|@@SHA256@@|$sha|" \
            packaging/homebrew/cupertino.rb > "$RUNNER_TEMP/cupertino.rb"
          existing=$(gh api repos/mgcrea/homebrew-tap/contents/Casks/cupertino.rb \
            --jq .sha 2>/dev/null || true)
          gh api -X PUT repos/mgcrea/homebrew-tap/contents/Casks/cupertino.rb \
            -f message="cupertino $VERSION" \
            $( [ -n "$existing" ] && echo -f sha="$existing" ) \
            -f content="$(base64 -i "$RUNNER_TEMP/cupertino.rb")"
      - name: Clean up secrets 🧹
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ac.p8" "$RUNNER_TEMP/cert.p12"
